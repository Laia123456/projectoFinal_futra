<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futra</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="jugadores.css">
</head>

<body>

    <header>

        <section class="section1_headerIncio">

            <a href="../index.html">
                <h1>Futra</h1>
            </a>

            <nav>
                <ul class="li_nav">

                    <a href="../index.html"><li>Inicio</li></a>

                    <a href="../equipos_pack/equipos.html"><li>Equipos</li></a>

                    <a href="../alineaciones_pack/alineaciones.html"><li>Alineaciones</li></a>

                    <a href="jugadores.html"><li>Jugadores</li></a>

                    <a href="../tacticas_pack/tacticas.html"><li>Tacticas</li></a>

                </ul>
            </nav>

        </section>

        <a href="../inicioSesion_pack/inicioSesion.html">
            <button class="button_incioSesion">Inicia sesion</button>
        </a>

    </header>

    <main>

        <!-- filtros -->
        <section class="col_filtros">

            <input class="input_filtrosJugadores" type="text" placeholder="Buscar jugador">

            <select class="select_filtroJugadores">
                <option value="">Posición</option>
                <option value="">Portero</option>
                <option value="">Defensa</option>
                <option value="">Centrocampista</option>
                <option value="">Delantero</option>
            </select>

            <select class="select_filtroJugadores">
                <option value="">Liga</option>
                <option value="">La Liga EASports</option>
                <option value="">Premier League</option>
                <option value="">Bundesliga</option>
                <option value="">Serie A</option>
            </select>

            <select class="select_filtroJugadores">
                <option value="">Equipo</option>
                <option value="">FC Barcelona</option>
                <option value="">Real Madrid</option>
            </select>

            <select class="select_filtroJugadores">
                <option value="">País</option>
                <option value="">España</option>
                <option value="">Francia</option>
                <option value="">Brasil</option>
            </select>

            <select class="select_filtroJugadores">
                <option value="">Valoración</option>
                <option value="">+90</option>
                <option value="">+85</option>
                <option value="">+80</option>
                <option value="">+75</option>
            </select>

        </section>

        <!-- jugadores -->
        <section class="container_jugadores">

            <!-- jugador -->
            <div class="jugador_card">
                <div class="jugador_acento"></div>
                <div class="jugador_img_wrap">
                    <img src="jugadores_img/lamine.png" alt="Lamine Yamal" class="jugador_img">
                </div>
                <div class="jugador_body">
                    <p class="jugador_nombre">Lamine Yamal</p>
                    <div class="jugador_meta">
                        <div class="grl_jugador media80">
                            <p>86</p>
                        </div>
                        <div class="posicion_jugador">
                            <p>ED</p>
                        </div>
                        <div class="banderaJugador">
                            <img src="españa.png" alt="">
                        </div>
                    </div>

                </div>

            </div>

            <!-- jugador -->
            <div class="jugador_card">
                <div class="jugador_acento"></div>
                <div class="jugador_img_wrap">
                    <img src="jugadores_img/mbappe.png" alt="Mbappe" class="jugador_img">
                </div>
                <div class="jugador_body">
                    <p class="jugador_nombre">Mbappé</p>
                    <div class="jugador_meta">
                        <div class="grl_jugador media90">
                            <p>91</p>
                        </div>
                        <div class="posicion_jugador">
                            <p>DC</p>
                        </div>
                        <div class="banderaJugador">
                            <img src="francia.webp" alt="">
                        </div>
                    </div>
                </div>
            </div>

            <!-- jugador -->
            <div class="jugador_card">
                <div class="jugador_acento"></div>
                <div class="jugador_img_wrap">
                    <img src="jugadores_img/pedri.webp" alt="Pedri" class="jugador_img">
                </div>
                <div class="jugador_body">
                    <p class="jugador_nombre">Pedri</p>
                    <div class="jugador_meta">
                        <div class="grl_jugador media80">
                            <p>87</p>
                        </div>
                        <div class="posicion_jugador">
                            <p>MC</p>
                        </div>
                        <div class="banderaJugador">
                            <img src="españa.png" alt="">
                        </div>
                    </div>
                </div>
            </div>

            <!-- jugador -->
            <div class="jugador_card">
                <div class="jugador_acento"></div>
                <div class="jugador_img_wrap">
                    <img src="jugadores_img/jude.png" alt="Bellingham" class="jugador_img">
                </div>
                <div class="jugador_body">
                    <p class="jugador_nombre">Bellingham</p>
                    <div class="jugador_meta">
                        <div class="grl_jugador media90">
                            <p>90</p>
                        </div>
                        <div class="posicion_jugador">
                            <p>MC</p>
                        </div>
                        <div class="banderaJugador">
                            <img src="inglaterra.png" alt="">
                        </div>
                    </div>
                </div>
            </div>

            <!-- jugador -->
            <div class="jugador_card">
                <div class="jugador_acento"></div>
                <div class="jugador_img_wrap">
                    <img src="jugadores_img/vini.png" alt="Vinicius" class="jugador_img">
                </div>
                <div class="jugador_body">
                    <p class="jugador_nombre">Vinicius Jr</p>
                    <div class="jugador_meta">
                        <div class="grl_jugador media90">
                            <p>90</p>
                        </div>
                        <div class="posicion_jugador">
                            <p>EI</p>
                        </div>
                        <div class="banderaJugador">
                            <img src="brasil.png" alt="">
                        </div>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <footer>
        <p class="p_footer">© Laia Marin Rosas</p>
    </footer>

</body>
</html>
